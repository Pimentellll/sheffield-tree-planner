name: readiness checks

on:
  pull_request:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: readiness-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            python: '3.12'
          - os: windows-latest
            python: '3.11'
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ matrix.python }}
      - name: Build and test diagnostic (no model or GPU)
        shell: bash
        run: |
          python -m pip install build==1.2.2.post1
          python -m build
          python -m pip install .
          python -m unittest discover -s tests -v
      - name: Validate inference configuration, without starting containers
        if: runner.os == 'Linux'
        run: docker compose -f deploy/spark/inference.compose.yml config --quiet
      - name: Clean artifact installation and real environment command
        shell: python
        env:
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          import hashlib, json, os, pathlib, subprocess, sys, tempfile, tomllib, venv
          root = pathlib.Path.cwd()
          version = tomllib.loads((root / 'pyproject.toml').read_text())['project']['version']
          if os.environ['REF_TYPE'] == 'tag':
              assert os.environ['REF_NAME'] == 'v' + version, 'tag/version mismatch'
          wheels = list((root / 'dist').glob('*.whl'))
          assert len(wheels) == 1
          with tempfile.TemporaryDirectory(prefix='readiness-', dir=os.environ['RUNNER_TEMP']) as directory:
              clean = pathlib.Path(directory)
              venv.create(clean / 'venv', with_pip=True)
              python = clean / 'venv' / ('Scripts/python.exe' if os.name == 'nt' else 'bin/python')
              cli = clean / 'venv' / ('Scripts/sheffield-readiness.exe' if os.name == 'nt' else 'bin/sheffield-readiness')
              env = dict(os.environ)
              env.pop('PYTHONPATH', None)
              subprocess.run([str(python), '-m', 'pip', 'install', str(wheels[0])], cwd=clean, env=env, check=True)
              actual = subprocess.check_output([str(cli), '--version'], cwd=clean, env=env, text=True).strip()
              assert actual == version
              subprocess.run([str(cli), '--help'], cwd=clean, env=env, check=True)
              receipt = json.loads(subprocess.check_output([str(cli), 'environment'], cwd=clean, env=env, text=True))
              assert receipt['ok'] and receipt['scope'] == 'environment_only'
              assert receipt['spark_verified'] is False and receipt['gpu_verified'] is False
              print(json.dumps(receipt))
          artifacts = sorted(p for p in (root / 'dist').iterdir() if p.suffix in ('.whl', '.gz'))
          (root / 'dist' / 'SHA256SUMS').write_text(''.join(hashlib.sha256(p.read_bytes()).hexdigest() + '  ' + p.name + '\n' for p in artifacts))
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: readiness-${{ matrix.os }}
          path: dist/*
          if-no-files-found: error
          retention-days: 7

  draft-release:
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    needs: check
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: readiness-ubuntu-24.04
          path: dist
      - name: Create private draft release only after an explicitly approved tag push
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: gh release create "$RELEASE_TAG" --verify-tag --draft --title "$RELEASE_TAG" --notes-file CHANGELOG.md dist/*
