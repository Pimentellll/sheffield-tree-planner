name: readiness checks

on:
  pull_request:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: readiness-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            python: '3.12'
          - os: windows-latest
            python: '3.11'
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    env:
      CANOPY_NUMERICS_SOURCE: ${{ github.workspace }}/.ci-numerics
      CANOPY_LOCAL_MODEL_BASE: ''
      CANOPY_LOCAL_MODEL: ''
      CANOPY_LIVE_PROOF_DIR: ''
      ARTIFACT_DIR: ${{ runner.temp }}/canopy-artifacts
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: Pimentellll/sheffield-tree-planner
          ref: 33493a327a99e5de2e579b5c3070ada137047c7e
          path: .ci-numerics
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        id: python
        with:
          python-version: ${{ matrix.python }}
      - name: Install locked tooling and dependencies
        shell: bash
        env:
          UV_PYTHON: ${{ steps.python.outputs.python-path }}
        run: |
          python -m pip install --require-hashes -r ci/uv-requirements.txt
          uv sync --frozen --extra dev
      - name: Full suite, source lint and generated contracts
        shell: bash
        env:
          UV_PYTHON: ${{ steps.python.outputs.python-path }}
        run: |
          uv run --frozen --no-sync python -m pytest -q -rs
          uv run --frozen --no-sync ruff check src backend scripts tests ci
          uv run --frozen --no-sync python scripts/generate_api_types.py --check
          npm ci --prefix ci/typescript --ignore-scripts --no-audit --no-fund
          node ci/typescript/node_modules/typescript/bin/tsc --strict --noEmit --target ES2022 --module ESNext --moduleResolution Bundler generated/contracts.ts generated/http.ts
      - name: Validate inference configuration, without starting containers
        if: runner.os == 'Linux'
        run: docker compose -f deploy/spark/inference.compose.yml config --quiet
      - name: Build and verify clean installed artifacts
        shell: bash
        env:
          UV_PYTHON: ${{ steps.python.outputs.python-path }}
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          mkdir "$ARTIFACT_DIR"
          uv build --out-dir "$ARTIFACT_DIR"
          python ci/installed_smoke.py
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: readiness-${{ matrix.os }}
          path: |
            ${{ runner.temp }}/canopy-artifacts/*.whl
            ${{ runner.temp }}/canopy-artifacts/*.tar.gz
            ${{ runner.temp }}/canopy-artifacts/SHA256SUMS
            ${{ runner.temp }}/canopy-artifacts/installed-smoke.json
          if-no-files-found: error
          retention-days: 7

  draft-release:
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    needs: check
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: readiness-ubuntu-24.04
          path: ${{ runner.temp }}/canopy-release
      - name: Create private draft release only after an explicitly approved tag push
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
          RELEASE_DIR: ${{ runner.temp }}/canopy-release
        run: |
          cd "$RELEASE_DIR"
          sha256sum --check SHA256SUMS
          gh release create "$RELEASE_TAG" --verify-tag --draft --title "$RELEASE_TAG" --notes-file "$GITHUB_WORKSPACE/CHANGELOG.md" ./*.whl ./*.tar.gz SHA256SUMS installed-smoke.json
