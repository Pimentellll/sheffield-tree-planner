[build-system]
requires = ["hatchling==1.27.0"]
build-backend = "hatchling.build"

[project]
name = "sheffield-tree-planner-readiness"
version = "0.2.0"
description = "CANOPY local planning backend and inference readiness diagnostic"
requires-python = ">=3.11"
dependencies = [
    "fastapi==0.143.3",
    "pydantic==2.14.1",
    "uvicorn==0.54.0",
    "httpx==0.28.1",
    "tzdata==2026.6",
    "pvlib==0.15.2",
    "pyproj==3.7.2",
]

[project.optional-dependencies]
dev = ["pytest==9.1.1", "ruff==0.17.1", "build==1.6.1", "jsonschema==4.26.0"]

[project.scripts]
sheffield-readiness = "sheffield_readiness:main"

[tool.hatch.build.targets.wheel]
packages = ["src/sheffield_readiness", "backend/src/tree_planner"]

[tool.hatch.build.targets.sdist]
include = ["/pyproject.toml", "/uv.lock", "/src/sheffield_readiness", "/backend", "/generated", "/scripts", "/tests", "/frontend", "/docs/REFERENCE_RUNTIME.md", "/docs/PHYSICAL_RUNTIME.md", "/README.md", "/CHANGELOG.md"]

[tool.pytest.ini_options]
testpaths = ["tests", "backend/tests"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
